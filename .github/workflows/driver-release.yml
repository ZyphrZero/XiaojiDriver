name: Driver CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing vX.Y.Z tag to publish from main; leave empty for CI only'
        type: string
        required: false

permissions:
  contents: read

jobs:
  ci:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_type == 'branch' && !github.event.deleted) ||
      (github.event_name == 'workflow_dispatch' && !inputs.release_tag)
    uses: ./.github/workflows/build-driver.yml

  release:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-driver.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
